services:
  burp:
    image: blurp-burp:local
    build: ./burp
    init: true
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      BURP_ACCEPT_EULA: ${BURP_ACCEPT_EULA:-}
    volumes:
      - burp-home:/home/burp
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9090/api/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  mcp:
    build: ./mcp
    network_mode: service:burp
    depends_on:
      burp:
        condition: service_healthy
    environment:
      REBURP_URL: http://127.0.0.1:9090
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  burp-home:
