services:
  burp-image:
    image: ghcr.io/spiizn/blurp-burp:${BLURP_IMAGE_TAG:-latest}
    build: ./burp
    profiles: ["image"]

  dind:
    image: docker:29.5.2-dind
    privileged: true
    networks:
      default:
        aliases: ["docker"]
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - dind-data:/var/lib/docker
      - dind-ca:/certs/ca
      - dind-client:/certs/client
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///var/run/docker.sock", "info"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mcp:
    image: ghcr.io/spiizn/blurp-mcp:${BLURP_IMAGE_TAG:-latest}
    build: ./mcp
    pull_policy: always
    init: true
    stop_grace_period: 150s
    depends_on:
      dind:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:8765"
    environment:
      BURP_ACCEPT_EULA: ${BURP_ACCEPT_EULA:-}
      BURP_IMAGE: ghcr.io/spiizn/blurp-burp:${BLURP_IMAGE_TAG:-latest}
      MCP_IMAGE: ghcr.io/spiizn/blurp-mcp:${BLURP_IMAGE_TAG:-latest}
      REBURP_HOST: docker
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN in .env}
      BURP_IDLE_SECONDS: ${BURP_IDLE_SECONDS:-300}
      MAX_BURP_SESSIONS: ${MAX_BURP_SESSIONS:-2}
      PROXPROX_PROXY_HOST: ${PROXPROX_PROXY_HOST:-proxy.proxprox.spiizn.xyz}
      PROXPROX_PROXY_PORT: ${PROXPROX_PROXY_PORT:-18443}
      PROXPROX_PROXY_TOKEN: ${PROXPROX_PROXY_TOKEN:?Set PROXPROX_PROXY_TOKEN in .env}
    volumes:
      - dind-client:/certs/client:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8765/health', headers={'Authorization': 'Bearer ' + os.environ['MCP_BEARER_TOKEN']}); urllib.request.urlopen(request, timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  dind-data:
  dind-ca:
  dind-client:
