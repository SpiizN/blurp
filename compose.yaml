services:
  burp-image:
    image: ghcr.io/spiizn/blurp-burp:${BLURP_IMAGE_TAG:-latest}
    build: ./burp
    profiles: ["image"]

  mcp:
    image: ghcr.io/spiizn/blurp-mcp:${BLURP_IMAGE_TAG:-latest}
    build: ./mcp
    pull_policy: always
    init: true
    user: "0:0"
    stop_grace_period: 150s
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:8765"
    environment:
      BURP_ACCEPT_EULA: ${BURP_ACCEPT_EULA:-}
      BURP_IMAGE: ghcr.io/spiizn/blurp-burp:${BLURP_IMAGE_TAG:-latest}
      MCP_IMAGE: ghcr.io/spiizn/blurp-mcp:${BLURP_IMAGE_TAG:-latest}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN in .env}
      BURP_IDLE_SECONDS: ${BURP_IDLE_SECONDS:-300}
      MAX_BURP_SESSIONS: ${MAX_BURP_SESSIONS:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8765/health', headers={'Authorization': 'Bearer ' + os.environ['MCP_BEARER_TOKEN']}); urllib.request.urlopen(request, timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
